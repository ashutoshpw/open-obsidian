name: Obsidian vault round-trip acceptance

on:
  push:
    branches: [main]
    paths:
      - ".agents/tasks/2026-10-07/audit-obsidian-vault-roundtrip.ts"
      - ".agents/tasks/2026-10-07/prepare-obsidian-reference.ts"
      - ".agents/tasks/2026-10-07/obsidian-reference-pin.json"
      - "apps/openobsidian/**"
      - "assets/openobsidian-icon.png"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/obsidian-vault-roundtrip.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-vault-roundtrip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  roundtrip:
    name: Obsidian 1.14.4 vault round-trip on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      OPENOBSIDIAN_BINARY: ${{ format('{0}/target/release/openobsidian{1}', github.workspace, runner.os == 'Windows' && '.exe' || '') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop and UI evidence dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-apps imagemagick tesseract-ocr \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libgtk-3-0 libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 \
            libnss3 libxss1 libasound2t64 libgbm1 libxkbcommon0

      - name: Install macOS screenshot OCR dependency
        if: runner.os == 'macOS'
        run: |
          if ! brew list --versions tesseract >/dev/null 2>&1; then
            brew install tesseract
          fi

      - name: Install Windows screenshot OCR dependency
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --yes --no-progress
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The pinned Obsidian extraction and Rust build write to separate directories.
      - parallel:
          - name: Download, verify, and install the pinned Obsidian desktop
            run: bun .agents/tasks/2026-10-07/prepare-obsidian-reference.ts

          - name: Build native OpenObsidian preview
            run: cargo build --package openobsidian --release --locked

      - name: Author, open, snapshot, and reopen the same vault
        if: runner.os == 'Linux'
        env:
          OBSIDIAN_REPORT_DIRECTORY: ${{ runner.temp }}/obsidian-vault-roundtrip-artifacts
          OBSIDIAN_ROUNDTRIP_WORK_DIRECTORY: ${{ runner.temp }}/openobsidian-c01-roundtrip
        run: |
          mkdir -p "$OBSIDIAN_REPORT_DIRECTORY" "$OBSIDIAN_ROUNDTRIP_WORK_DIRECTORY"
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            bun .agents/tasks/2026-10-07/audit-obsidian-vault-roundtrip.ts

      - name: Author, open, snapshot, and reopen the same vault
        if: runner.os != 'Linux'
        env:
          OBSIDIAN_REPORT_DIRECTORY: ${{ runner.temp }}/obsidian-vault-roundtrip-artifacts
          OBSIDIAN_ROUNDTRIP_WORK_DIRECTORY: ${{ runner.temp }}/openobsidian-c01-roundtrip
        run: bun .agents/tasks/2026-10-07/audit-obsidian-vault-roundtrip.ts

      - name: Upload round-trip report, snapshots, screenshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-vault-roundtrip-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/obsidian-vault-roundtrip-artifacts/
          if-no-files-found: warn
          retention-days: 30
