name: Obsidian vault round-trip acceptance

on:
  push:
    branches: [main]
    paths:
      - ".agents/tasks/2026-10-07/audit-obsidian-vault-roundtrip.ts"
      - ".agents/tasks/2026-10-07/obsidian-reference-pin.json"
      - "apps/openobsidian/**"
      - "assets/openobsidian-icon.png"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/obsidian-vault-roundtrip.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-vault-roundtrip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-roundtrip:
    name: Obsidian 1.14.4 vault round-trip on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop and UI evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-apps imagemagick tesseract-ocr \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libgtk-3-0 libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 \
            libnss3 libxss1 libasound2t64 libgbm1 libxkbcommon0

      - name: Read pinned official Obsidian release
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          pin = json.loads(Path(".agents/tasks/2026-10-07/obsidian-reference-pin.json").read_text())
          print(f"version={pin['version']}")
          print(f"download_url={pin['download_url']}")
          print(f"sha256={pin['sha256']}")
          PY

      - name: Download and verify the pinned AppImage
        env:
          OBSIDIAN_DOWNLOAD_URL: ${{ steps.pin.outputs.download_url }}
          OBSIDIAN_RELEASE_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          curl --fail --location --retry 3 "$OBSIDIAN_DOWNLOAD_URL" --output "$RUNNER_TEMP/Obsidian.AppImage"
          printf '%s  %s\n' "$OBSIDIAN_RELEASE_SHA256" "$RUNNER_TEMP/Obsidian.AppImage" | sha256sum --check
          chmod u+x "$RUNNER_TEMP/Obsidian.AppImage"
          mkdir -p "$RUNNER_TEMP/obsidian-appimage"
          (
            cd "$RUNNER_TEMP/obsidian-appimage"
            "$RUNNER_TEMP/Obsidian.AppImage" --appimage-extract
          )

      - name: Build native OpenObsidian preview
        run: cargo build --package openobsidian --release --locked

      - name: Author, open, snapshot, and reopen the same vault
        env:
          OBSIDIAN_RELEASE_VERSION: ${{ steps.pin.outputs.version }}
          OBSIDIAN_RELEASE_SHA256: ${{ steps.pin.outputs.sha256 }}
          OBSIDIAN_BINARY: ${{ runner.temp }}/obsidian-appimage/squashfs-root/obsidian
          OPENOBSIDIAN_BINARY: ${{ github.workspace }}/target/release/openobsidian
          OBSIDIAN_REPORT_DIRECTORY: ${{ runner.temp }}/obsidian-vault-roundtrip-artifacts
          OBSIDIAN_ROUNDTRIP_WORK_DIRECTORY: ${{ runner.temp }}/openobsidian-c01-roundtrip
        run: |
          mkdir -p "$OBSIDIAN_REPORT_DIRECTORY" "$OBSIDIAN_ROUNDTRIP_WORK_DIRECTORY"
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            bun .agents/tasks/2026-10-07/audit-obsidian-vault-roundtrip.ts

      - name: Upload round-trip report, snapshots, screenshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-vault-roundtrip-${{ github.sha }}
          path: ${{ runner.temp }}/obsidian-vault-roundtrip-artifacts/
          if-no-files-found: warn
          retention-days: 30
