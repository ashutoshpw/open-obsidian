name: OpenObsidian quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate progress state
        run: bun run validate:state
      - name: Validate frozen contracts
        run: bun run validate:contracts
      - name: Validate architecture manifest
        run: bun run validate:architecture
      - name: Verify version baseline policy
        run: bun run verify:version-baseline
      - name: Validate vault differential fixture contract
        run: bun run validate:differential
      - name: Run host vault round-trip report
        run: bun run audit:vault-roundtrip
      - name: Validate C10 core workflow inventory
        run: bun run validate:workflows
      - name: Verify distribution metadata
        run: bun run verify:distribution
      - name: Verify update/rollback manifest contract
        run: bun run release:update-check
      - name: Check renderer accessibility contract
        run: bun run check:accessibility
      - name: Type-check source
        run: bun run typecheck
      - name: Run tests
        run: bun test
      - name: Run executable quality scorecard
        run: bun run quality:program
      - name: Compile Electron shell
        run: bun run compile
      - name: Run Electron vault round-trip report
        run: bun run audit:electron-vault
      - name: Run Knip audit
        run: bun run knip
      - name: Run Fallow health audit
        run: bunx fallow health --root . --format compact --report-only
      - name: Review changed code with Fallow
        if: github.event_name == 'pull_request'
        run: bunx fallow audit --root . --base ${{ github.event.pull_request.base.sha }} --format compact --brief
