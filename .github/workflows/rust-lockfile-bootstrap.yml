name: Rust lockfile bootstrap

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - apps/*/Cargo.toml
      - .github/workflows/rust-lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependency graph in GitHub CI
        run: cargo metadata --format-version 1 > /dev/null

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
