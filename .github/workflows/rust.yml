name: OpenObsidian Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (egui/winit/Wry)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun for pinned compatibility fixtures
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Formatting does not share Cargo's build directory with tests, so run it concurrently.
      - parallel:
          - name: Check formatting
            if: runner.os == 'Linux'
            run: cargo fmt --all -- --check
          - name: Run workspace tests
            run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check crate dependency layers
        run: cargo xtask layers

      - name: Build native preview
        run: cargo build --workspace --release --locked

      - name: Run unchanged plugin Wry feasibility probes
        run: bun scripts/audit-rust-plugin-runtime.ts > rust-plugin-runtime-${{ runner.os }}.json

      - name: Upload Wry compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-plugin-runtime-${{ runner.os }}-${{ github.sha }}
          path: rust-plugin-runtime-${{ runner.os }}.json
          if-no-files-found: ignore

      - name: Upload Linux preview executable
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-rust-preview-${{ github.sha }}
          path: target/release/openobsidian
          if-no-files-found: error
