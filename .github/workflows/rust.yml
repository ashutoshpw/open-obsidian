name: OpenObsidian Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@v2

      # The first workspace push bootstraps Cargo.lock in GitHub Actions. Commit the uploaded
      # lockfile in the next small slice; all later jobs verify the committed graph with --locked.
      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check crate dependency layers
        run: cargo xtask layers

      - name: Build native preview
        run: cargo build --workspace --release --locked

      - name: Upload generated Cargo.lock
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-cargo-lock
          path: Cargo.lock
          if-no-files-found: warn

      - name: Upload Linux preview executable
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-rust-preview-${{ github.sha }}
          path: target/release/openobsidian
          if-no-files-found: error
