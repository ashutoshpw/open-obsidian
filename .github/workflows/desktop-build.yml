name: OpenObsidian desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Preview or production gate"
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || startsWith(github.ref, 'refs/tags/') && 'production' || 'preview' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      RELEASE_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      RELEASE_STAGING_URL: ${{ vars.RELEASE_STAGING_URL }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build unpacked desktop application
        run: bun run package:dir
      - name: Validate release gate and write release-manifest.json sha256 hashes
        run: bun run release:gate -- --artifacts-dir out
      - name: Upload platform artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-${{ runner.os }}-${{ env.RELEASE_MODE }}-${{ github.sha }}
          path: out
          if-no-files-found: error
