name: Compatibility pin refresh check

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # These verification commands read independent snapshots and do not modify the checkout.
      - parallel:
          - name: Verify version baseline policy
            run: bun run verify:version-baseline
          - name: Verify plugin selection snapshot
            run: bun run verify:plugin-selection
          - name: Verify release asset compatibility pins
            run: bun run verify:compatibility-pins
          - name: Verify recorded primary references
            run: bun run verify:primary-references
