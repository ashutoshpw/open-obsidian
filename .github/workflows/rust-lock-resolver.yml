name: Temporary Rust lockfile resolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and compile committed workspace in CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (egui/winit/Wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Resolve dependencies and compile all targets
        run: cargo check --workspace --all-targets

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
