name: Temporary Rust lockfile resolver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and compile committed workspace in CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependencies and compile all targets
        run: cargo check --workspace --all-targets

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: openobsidian-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
