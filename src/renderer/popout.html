<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenObsidian · Note popout</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #202020; color: #e8eaf0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: #202020; }
      main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; min-height: 100vh; padding: 18px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ffffff22; padding-bottom: 12px; }
      h1 { margin: 0; font-size: 16px; font-weight: 600; }
      #popout-path { margin: 4px 0 0; color: #a9adba; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      button { border: 1px solid #ffffff2c; border-radius: 6px; padding: 7px 12px; background: #2c2c2c; color: inherit; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { background: #383838; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      button:focus-visible, textarea:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
      textarea { width: 100%; min-height: 0; resize: none; border: 1px solid #ffffff2c; border-radius: 8px; padding: 16px; background: #151515; color: #e8eaf0; font: 14px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
      textarea:disabled { opacity: .75; }
      #status { min-height: 1.5em; color: #a9adba; font-size: 12px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; } }
      @media (max-width: 560px) { main { padding: 12px; } header { align-items: flex-start; flex-direction: column; } .actions { justify-content: flex-start; } }
    </style>
  </head>
  <body class="mod-popout">
    <main class="workspace workspace-leaf workspace-leaf-content view-content" aria-labelledby="popout-title">
      <header class="view-header">
        <div>
          <h1 id="popout-title">Note popout</h1>
          <p id="popout-path">Waiting for the main workspace…</p>
        </div>
        <div class="actions" aria-label="Popout note actions">
          <button id="reload-note" type="button" disabled>Reload disk version</button>
          <button id="save-popout" type="button" disabled>Save · ⌘/Ctrl S</button>
        </div>
      </header>
      <textarea id="popout-editor" aria-label="Markdown note editor popout" spellcheck="false" disabled></textarea>
      <p id="appearance-status" role="status" aria-live="polite">Vault appearance preview is not loaded.</p>
      <div id="status" role="status" aria-live="polite">Waiting for the note popout to initialize.</div>
    </main>
    <script type="module" src="../../dist/popout.js"></script>
  </body>
</html>
