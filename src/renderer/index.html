<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenObsidian</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: #171717; color: #f4f4f5; }
      main { box-sizing: border-box; display: grid; min-height: 100vh; place-items: center; padding: 40px; }
      section { width: min(680px, 100%); padding: 42px; border: 1px solid #3f3f46; border-radius: 18px; background: #202023; box-shadow: 0 24px 80px #0006; }
      h1 { margin: 0 0 12px; letter-spacing: -0.03em; }
      p { color: #a1a1aa; line-height: 1.6; }
      button { margin-top: 18px; border: 0; border-radius: 10px; padding: 12px 18px; background: #a78bfa; color: #18181b; cursor: pointer; font: inherit; font-weight: 700; }
      button:disabled { cursor: progress; opacity: 0.7; }
      #status { min-height: 24px; margin-top: 22px; color: #d4d4d8; overflow-wrap: anywhere; }
      code { color: #c4b5fd; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>OpenObsidian</h1>
        <p>Open an existing vault in place. The first shell keeps the selected folder authoritative while the vault core proves byte-safe operations.</p>
        <button id="select-vault" type="button">Open existing vault</button>
        <div id="status" role="status" aria-live="polite">No vault selected.</div>
      </section>
    </main>
    <script type="module" src="../../dist/renderer.js"></script>
  </body>
</html>
